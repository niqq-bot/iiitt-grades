services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: local

      GOOGLE_ID: ${GOOGLE_ID}
      GOOGLE_SECRET: ${GOOGLE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iiittgrades
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret


  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: iiittgrades

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      - app


volumes:
  postgres_data: