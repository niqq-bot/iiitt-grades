services:
  app:
    build: .
    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: local

      GOOGLE_ID: ${GOOGLE_ID}
      GOOGLE_SECRET: ${GOOGLE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iiittgrades
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret


  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: iiittgrades

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data: